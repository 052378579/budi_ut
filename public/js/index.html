<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Direktori Terlarang</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
            text-align: center;
        }
        .container {
            position: relative;
            z-index: 10;
        }
        h1 {
            font-size: 10rem;
            margin: 0;
            line-height: 1;
            text-shadow: 0 10px 20px rgba(0,0,0,0.3);
            animation: float 3s ease-in-out infinite;
        }
        h2 {
            font-size: 2rem;
            margin-top: 10px;
            margin-bottom: 5px;
            font-weight: 600;
        }
        p {
            font-size: 1.1rem;
            margin-top: 5px;
            opacity: 0.8;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 35px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: all 0.3s ease;
            border: 2px solid rgba(255,255,255,0.4);
            backdrop-filter: blur(5px);
        }
        .btn:hover {
            background: white;
            color: #1e3c72;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border-color: white;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        
        /* Background Animated Circles */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            animation: pulse 4s infinite alternate;
            z-index: 0;
        }
        .circle-1 { width: 400px; height: 400px; top: -150px; left: -150px; animation-delay: 0s; }
        .circle-2 { width: 500px; height: 500px; bottom: -200px; right: -150px; animation-delay: 2s; }
        .circle-3 { width: 200px; height: 200px; top: 15%; right: 10%; animation-delay: 1s; }
        .circle-4 { width: 100px; height: 100px; bottom: 20%; left: 15%; animation-delay: 3s; }
        
        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(20px, 20px); background: rgba(255, 255, 255, 0.1); }
        }
    </style>
</head>
<body>
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
    <div class="circle circle-4"></div>
    
    <div class="container">
        <h1>404</h1>
        <h2>Akses Ditolak!</h2>
        <p>Maaf, Anda sedang mencoba mengintip ke dalam brankas direktori aset yang tidak diizinkan untuk dijelajahi publik.</p>
        <a href="/" class="btn">Kembali ke Beranda</a>
    </div>
</body>
</html>
